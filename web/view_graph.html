<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rugby player co-occurrence graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { --bg: #11151c; --panel: #1a2029; --text: #d6dbe2; --muted: #8a93a0;
          --accent: #7db4ff; --border: #2a323e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
         overflow: hidden; }
  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
           padding: 10px 16px; background: var(--panel);
           border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #stats { color: var(--muted); font-size: 12px; }
  .control { display: flex; align-items: center; gap: 8px; font-size: 12px;
             color: var(--muted); }
  .control input[type=range] { width: 140px; }
  #search { background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 5px 10px; border-radius: 6px;
            font-size: 12px; width: 200px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search-results { position: absolute; z-index: 20; background: var(--panel);
                    border: 1px solid var(--border); border-radius: 6px;
                    max-height: 220px; overflow-y: auto; display: none;
                    min-width: 220px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  #search-results div { padding: 6px 10px; cursor: pointer; font-size: 12px; }
  #search-results div:hover { background: var(--border); }
  .btn { background: var(--bg); border: 1px solid var(--border);
         color: var(--text); padding: 5px 12px; border-radius: 6px;
         font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  #params { background: var(--panel); border-bottom: 1px solid var(--border);
            padding: 8px 16px; display: flex; flex-wrap: wrap;
            gap: 16px; align-items: center; }
  #params .prow { display: flex; gap: 16px; flex-wrap: wrap;
                  align-items: center; }
  #params .control { flex-direction: column; align-items: flex-start; gap: 2px; }
  #hud { position: absolute; right: 16px; top: 60px; z-index: 10;
         background: rgba(26,32,41,.9); border: 1px solid var(--border);
         border-radius: 8px; padding: 10px 12px; font-size: 12px;
         max-width: 260px; display: none; }
  #hud .name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  #hud .row { color: var(--muted); margin: 2px 0; }
  #hud .links { color: var(--muted); margin-top: 6px; font-size: 11px;
                max-height: 120px; overflow-y: auto; }
  #legend { position: absolute; left: 16px; bottom: 16px; z-index: 10;
            background: rgba(26,32,41,.9); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 12px; font-size: 11px;
            color: var(--muted); }
  #legend .sw { display: inline-block; width: 10px; height: 10px;
                border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  svg { width: 100vw; height: calc(100vh - 48px); display: block; }
  .node { cursor: pointer; }
  .node-label { font-size: 10px; fill: var(--muted); pointer-events: none;
                text-shadow: 0 1px 2px #000; }
  .dim { opacity: .08; }
  .tip { position: absolute; background: var(--panel); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 10px; font-size: 12px; pointer-events: none;
         display: none; z-index: 30; }
</style>
</head>
<body>
<header>
  <h1>Rugby co-occurrence graph</h1>
  <div id="stats"></div>
  <div class="control">
    <label for="minw">Min shared matches</label>
    <input type="range" id="minw" min="1" max="45" value="1">
    <span id="minw-val">1</span>
  </div>
  <div class="control">
    <label for="maxd">Max degree</label>
    <input type="range" id="maxd" min="1" max="90" value="90">
    <span id="maxd-val">90</span>
  </div>
  <div class="control">
    <input type="text" id="search" placeholder="Find player...">
    <div id="search-results"></div>
  </div>
  <button id="params-toggle" class="btn">Force params</button>
</header>

<div id="params" style="display:none">
  <div class="prow">
    <div class="control"><label>Link distance</label>
      <input type="range" id="p-dist" min="10" max="200" value="120">
      <span id="p-dist-val">120</span></div>
    <div class="control"><label>Link strength</label>
      <input type="range" id="p-str" min="0" max="100" value="40">
      <span id="p-str-val">40</span></div>
    <div class="control"><label>Charge</label>
      <input type="range" id="p-chg" min="-1000" max="-20" value="-600" step="10">
      <span id="p-chg-val">-600</span></div>
    <div class="control"><label>Collide</label>
      <input type="range" id="p-coll" min="0" max="30" value="8">
      <span id="p-coll-val">8</span></div>
    <div class="control"><label>Alpha decay</label>
      <input type="range" id="p-decay" min="1" max="200" value="20">
      <span id="p-decay-val">20</span></div>
    <button id="p-apply" class="btn">Apply</button>
    <button id="p-reset" class="btn">Reset</button>
  </div>
</div>

<div id="hud"></div>
<div id="legend">
  <div><span class="sw" style="background:#5ac8fa"></span>node = player, size = appearances</div>
  <div><span class="sw" style="background:#8e8e93"></span>edge = shared match, width = co-occurrences</div>
  <div>color: <span style="color:#5ac8fa">■</span> few matches &nbsp; <span style="color:#ff2d55">■</span> many</div>
</div>
<div class="tip"></div>

<svg id="graph"></svg>

<script>
const SVG = d3.select("#graph");
let width = window.innerWidth, height = window.innerHeight - 48;
SVG.attr("width", width).attr("height", height);

const color = d3.scaleSequential(d3.interpolateTurbo)
  .domain([0, 1]);

Promise.all([
  fetch("../data/graph.json").then(r => r.json()),
  fetch("../data/dataset.json").then(r => r.json()).catch(() => null),
]).then(([g, ds]) => {
  const players = Object.fromEntries(
    Object.entries(g.players).map(([k, v]) => [Number(k), v]));
  const appearances = Object.fromEntries(
    Object.entries(g.appearances).map(([k, v]) => [Number(k), Number(v)]));

  let nodes = Object.entries(appearances).map(([id, app]) => ({
    id: Number(id), name: players[Number(id)] || String(id), app, deg: 0,
  }));

  let allLinks = g.edges.map(e => {
    const a = nodes.find(n => n.id === e.playerA);
    const b = nodes.find(n => n.id === e.playerB);
    return a && b ? { source: a, target: b, w: e.weight } : null;
  }).filter(Boolean);
  const maxW = d3.max(allLinks, l => l.w);

  for (const l of allLinks) { l.source.deg++; l.target.deg++; }
  const maxDeg = d3.max(nodes, n => n.deg);

  function nodeColor(n) { return color(n.deg / (maxDeg || 1)); }

  // edge weight filter state
  let minW = 1, maxD = maxDeg;

  function filterData() {
    const links = allLinks.filter(l =>
      l.w >= minW && l.source.deg <= maxD && l.target.deg <= maxD);
    const keep = new Set();
    for (const l of links) { keep.add(l.source); keep.add(l.target); }
    const ns = nodes.filter(n => keep.has(n));
    return { nodes: ns, links };
  }

  function render() {
    const { nodes: ns, links: ls } = filterData();

    sim.nodes(ns);
    sim.force("link").links(ls);
    sim.alpha(0.7).restart();

    link = linkGroup.selectAll("line").data(ls);
    link.exit().remove();
    link = link.enter().append("line")
      .attr("stroke", "#5b6472")
      .merge(link)
        .attr("stroke-width", d => 0.4 + 4.6 * Math.sqrt(d.w / maxW))
      .attr("stroke-opacity", 0.5);

    node = nodeGroup.selectAll("circle").data(ns, d => d.id);
    node.exit().remove();
    node = node.enter().append("circle")
      .attr("class", "node")
      .attr("r", 0)
      .call(drag)
      .merge(node)
      .attr("fill", d => nodeColor(d))
      .attr("stroke", "#0b0e13")
      .attr("stroke-width", 1)
      .on("mouseover", showTip)
      .on("mousemove", moveTip)
      .on("mouseout", hideTip)
      .on("click", selectNode);

    label = labelGroup.selectAll("text").data(ns, d => d.id);
    label.exit().remove();
    label = label.enter().append("text").attr("class", "node-label")
      .merge(label)
      .text(d => d.deg > Math.floor(maxDeg / 3) ? d.name : "")
      .style("display", d => d.deg > Math.floor(maxDeg / 3) ? null : "none");

    updateStats(ns, ls);
  }

  // ---- simulation ----
  const FORCE = {
    dist: 120, str: 0.4, chg: -600, coll: 8, decay: 0.02,
  };
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(allLinks).id(d => d.id)
      .distance(FORCE.dist).strength(l => FORCE.str * (0.4 + 0.6 * (l.w / maxW))))
    .force("charge", d3.forceManyBody().strength(FORCE.chg))
    .force("x", d3.forceX(width / 2).strength(0.15))
    .force("y", d3.forceY(height / 2).strength(0.15))
    .force("collide", d3.forceCollide().radius(d => FORCE.coll + Math.sqrt(d.app) * 1.0)
      .iterations(3))
    .alphaDecay(FORCE.decay)
    .on("tick", ticked);

  function applyForces() {
    sim.force("link").distance(FORCE.dist)
       .strength(l => FORCE.str * (0.4 + 0.6 * (l.w / maxW)));
    sim.force("charge").strength(FORCE.chg);
    sim.force("collide").radius(d => FORCE.coll + Math.sqrt(d.app) * 1.0);
    sim.force("x").strength(0.15);
    sim.force("y").strength(0.15);
    sim.alphaDecay(FORCE.decay);
    sim.alpha(0.8).restart();
  }

  function ticked() {
    node.attr("cx", d => d.x).attr("cy", d => d.y)
        .attr("r", d => 3 + Math.sqrt(d.app) * 1.0);
    label.attr("x", d => d.x + 5).attr("y", d => d.y + 3);
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  }

  const linkGroup = SVG.append("g");
  const nodeGroup = SVG.append("g");
  const labelGroup = SVG.append("g");

  // drag (defined before render so nodes pick it up)
  const drag = d3.drag()
    .on("start", (ev, d) => {
      if (!ev.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on("end", (ev, d) => {
      if (!ev.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
    });

  let node, link, label;

  // ---- interaction ----
  const tip = d3.select(".tip");
  const hud = d3.select("#hud");

  function neighborsOf(n) {
    return allLinks.filter(l =>
      l.w >= minW &&
      (l.source.id === n.id || l.target.id === n.id) &&
      l.source.deg <= maxD && l.target.deg <= maxD);
  }
  function partner(l, n) { return l.source.id === n.id ? l.target : l.source; }

  function clearSelection() {
    hud.style("display", "none");
    node.classed("dim", false)
        .attr("stroke", "#0b0e13")
        .attr("stroke-width", 1);
    link.classed("dim", false)
        .attr("stroke", "#5b6472")
        .attr("stroke-width", d => 0.4 + 4.6 * Math.sqrt(d.w / maxW))
        .attr("stroke-opacity", d => 0.15 + 0.75 * Math.sqrt(d.w / maxW));
  }
  d3.select(document).on("click.hud-clear", function (ev) {
    if (ev.target.id === "hud-clear") clearSelection();
  });
  SVG.on("click.empty", function (ev) {
    if (!ev.target.closest(".node")) clearSelection();
  });
  d3.select(document).on("keydown.hud-clear", function (ev) {
    if (ev.key === "Escape") clearSelection();
  });

  function showTip(ev, d) {
    tip.html(`<b>${d.name}</b> &middot; ${d.app} appearances`);
    tip.style("display", "block");
    const nb = neighborsOf(d);
    tip.html(`<b>${d.name}</b> &middot; ${d.app} appearances,
              ${d.deg} teammates`);
  }
  function moveTip(ev) {
    tip.style("left", (ev.pageX + 14) + "px").style("top", (ev.pageY + 14) + "px");
  }
  function hideTip() { tip.style("display", "none"); }

  function selectNode(ev, d) {
    const nb = neighborsOf(d);
    const partnerLinks = nb.sort((a, b) => b.w - a.w).slice(0, 12);

    node.attr("stroke", "#0b0e13").attr("stroke-width", 1);
    link.attr("stroke-opacity", d => 0.15 + 0.75 * Math.sqrt(d.w / maxW));

    node.classed("dim", true);
    link.classed("dim", true);
    const keep = new Set([d.id]);
    for (const l of nb) { keep.add(l.source.id); keep.add(l.target.id); }
    node.filter(n => keep.has(n)).classed("dim", false);
    link.filter(l => keep.has(l.source.id) && keep.has(l.target.id))
        .classed("dim", false)
        .attr("stroke", "#ffd166")
        .attr("stroke-width", l => 1.0 + 5.0 * Math.sqrt(l.w / maxW))
        .attr("stroke-opacity", 0.9);
    node.filter(n => n.id === d.id).attr("stroke", "#ffd166")
        .attr("stroke-width", 2.5);

    const rows = partnerLinks.map(l =>
      `<div>${partner(l, d).name} &mdash; ${l.w}</div>`).join("");
    hud.html(`
      <div class="name">${d.name}</div>
      <div class="row">${d.app} appearances &middot; ${d.deg} teammates</div>
      <div class="row">showing ${nb.length} links</div>
      <div class="links">${rows}</div>
      <div style="margin-top:6px;cursor:pointer;color:#7db4ff" id="hud-clear">clear</div>
    `).style("display", "block");
  }

  // ---- search ----
  const results = d3.select("#search-results");
  d3.select("#search").on("input", function () {
    const q = this.value.trim().toLowerCase();
    results.style("display", q ? "block" : "none").html("");
    if (!q) return;
    const hits = nodes.filter(n => n.name.toLowerCase().includes(q))
      .sort((a, b) => b.app - a.app).slice(0, 12);
    results.selectAll("div").data(hits).enter().append("div")
      .html(d => `<b>${d.name}</b> &middot; ${d.app} apps`)
      .on("mousedown", () => {});
    results.selectAll("div").data(hits).on("click", function (ev, d) {
      results.style("display", "none");
      selectNode(ev, d);
    });
  });
  d3.select(document).on("click", function (ev) {
    if (!ev.target.closest("#search")) results.style("display", "none");
  });

  // ---- controls ----
  d3.select("#minw").on("input", function () {
    minW = +this.value;
    d3.select("#minw-val").text(minW);
    render();
  });
  d3.select("#maxd").on("input", function () {
    maxD = +this.value;
    d3.select("#maxd-val").text(maxD);
    render();
  });

  // ---- force parameter panel ----
  const FIELDS = [
    ["#p-dist", "dist", v => FORCE.dist = +v],
    ["#p-str", "str", v => FORCE.str = +v / 100],
    ["#p-chg", "chg", v => FORCE.chg = +v],
    ["#p-coll", "coll", v => FORCE.coll = +v],
    ["#p-decay", "decay", v => FORCE.decay = +v / 1000],
  ];
  for (const [sel, key, set] of FIELDS) {
    d3.select(sel).on("input", function () {
      set(this.value);
      d3.select(sel + "-val").text(this.value);
    });
  }
  d3.select("#p-apply").on("click", () => applyForces());
  d3.select("#p-reset").on("click", () => {
    FORCE.dist = 120; FORCE.str = 0.4; FORCE.chg = -600;
    FORCE.coll = 8; FORCE.decay = 0.02;
    const vals = { "#p-dist": 120, "#p-str": 40, "#p-chg": -600,
                   "#p-coll": 8, "#p-decay": 20 };
    for (const [sel, v] of Object.entries(vals)) {
      d3.select(sel).property("value", v);
      d3.select(sel + "-val").text(v);
    }
    applyForces();
  });
  d3.select("#params-toggle").on("click", function () {
    const shown = d3.select("#params").style("display") !== "none";
    d3.select("#params").style("display", shown ? "none" : "flex");
    this.textContent = shown ? "Force params" : "Hide params";
  });

  function updateStats(ns, ls) {
    d3.select("#stats").text(
      `${ns.length} players &middot; ${ls.length} edges (of ${allLinks.length}) &middot; max degree ${maxDeg}`);
  }

  // ---- zoom / pan ----
  const zoom = d3.zoom()
    .scaleExtent([0.1, 8])
    .filter(ev => !ev.target.classList.contains("node"))
    .on("zoom", ev => SVG.selectAll("g").attr("transform", ev.transform));
  SVG.call(zoom).on("dblclick.zoom", null);

  window.addEventListener("resize", () => {
    width = window.innerWidth; height = window.innerHeight - 48;
    SVG.attr("width", width).attr("height", height);
    sim.force("x").x(width / 2);
    sim.force("y").y(height / 2);
  });

  render();
});
</script>
</body>
</html>
