[project]
name = "rugby-composition-predictor"
version = "0.1.0"
description = "Build a dataset and co-occurrence graph of South African international rugby matches"
readme = "README.md"
authors = [
    { name = "andrewboyley", email = "andy.boyley@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
rugby-composition-predictor = "rugby_composition_predictor.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "PYI", "RUF"]

[tool.ruff.format]
quote-style = "double"
