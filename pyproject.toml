[project]
name = "rugby-data"
version = "0.1.0"
description = "Build a versioned dataset of international rugby matches"
readme = "README.md"
authors = [
    { name = "andrewboyley", email = "andy.boyley@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.16.2",
    "ty>=0.0.1",
]

[project.scripts]
rugby-data = "rugby_data.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "PYI", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
